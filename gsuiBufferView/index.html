<style>
:root {
	--TryMe-w: 500px;
	--TryMe-h: 300px;
}

<div id="TryComponent">
	<gsui-buffer-view
		view="0 .7"
		selection=".1 .4"
	></gsui-buffer-view>
</div>

<script>
const uiBufView = $( "gsui-buffer-view" );
const ctx = new AudioContext();

// fetch( "test-assets/808kick.wav" )
fetch( "test-assets/left-to-right.mp3" )
// fetch( "test-assets/Rally House.mp3" )
	.then( res => res.arrayBuffer() )
	.then( arr => ctx.decodeAudioData( arr ) )
	.then( buf => uiBufView.$message( GSEV_BUFFERVIEW_BUFFER, buf ) );
</script>
