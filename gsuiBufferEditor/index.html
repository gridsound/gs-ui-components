	--TryMe-h: 300px;
}

<div id="TryComponent">
	<gsui-buffer-editor></gsui-buffer-editor>
</div>

<script>
const uiBufEdit = $( "gsui-buffer-editor" );
const ctx = new AudioContext();
let bufSave; // because WeakRef;

// fetch( "test-assets/808kick.wav" )
fetch( "test-assets/left-to-right.mp3" )
// fetch( "test-assets/Rally House.mp3" )
	.then( res => res.arrayBuffer() )
	.then( arr => ctx.decodeAudioData( arr ) )
	.then( buf => {
		bufSave = buf;
		uiBufEdit.$message( GSEV_BUFFEREDITOR_BUFFER, buf );
	} );
</script>
