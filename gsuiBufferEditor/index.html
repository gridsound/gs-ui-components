<style>
:root {
	--TryMe-w: 500px;
	--TryMe-h: 300px;
}
</style>

<div id="TryComponent">
	<gsui-buffer-editor></gsui-buffer-editor>
</div>

<script>
const uiBufEdit = $( "gsui-buffer-editor" );
let bufSave; // because WeakRef;

// fetch( "test-assets/808kick.wav" )
fetch( "test-assets/left-to-right.mp3" )
// fetch( "test-assets/Rally House.mp3" )
	.then( res => res.arrayBuffer() )
	.then( arr => gswaContext.$decodeAudioData( arr ) )
	.then( buf => {
		bufSave = buf;
		uiBufEdit.$message( GSEV_BUFFEREDITOR_BUFFER, buf );
	} );

uiBufEdit.$listen( {
	[ GSEV_BUFFEREDITOR_SAVE ]: d => {
		lg( "saving", d.$args[ 0 ] );
		GSUwait( 1 ).then( () => uiBufEdit.$rmAttr( "saving" ) );
	},
	[ GSEV_BUFFEREDITOR_EXTRACT ]: d => {
		lg( "extracting", d.$args[ 0 ] );
		GSUwait( 1 ).then( () => uiBufEdit.$rmAttr( "extracting" ) );
	},
} );
</script>
