<style>
:root {
	--TryMe-w: 340px;
	--TryMe-h: 240px;
}
gsui-periodicwave {
	position: absolute;
	inset: 0;
}
#TryControls {
	b {
		display: inline-flex;
		width: 48px;
	}
	input[ type=range ] {
		width: 80px;
	}
	code {
		width: 4ch;
	}
}
</style>

<div id="TryComponent">
	<gsui-periodicwave></gsui-periodicwave>
</div>

<div id="TryControls">
	<gs-flex x g4>
		<gsui-com-button icon="wave-sin" data-w="sine"></gsui-com-button>
		<gsui-com-button icon="wave-tri" data-w="triangle"></gsui-com-button>
		<gsui-com-button icon="wave-saw" data-w="sawtooth"></gsui-com-button>
		<gsui-com-button icon="wave-squ" data-w="square"></gsui-com-button>
	</gs-flex>
</div>

<script>
const el = $( "gsui-periodicwave" );
const ctrl = $( "#TryControls" );
const btns = ctrl.$query( "gsui-com-button" );
const inps = $( [
	[ "nbPts",  "nbPts",      2, 512, 1.00, 200 ],
	[ "dur",    "duration",   1,  16, 0.01,   1 ],
	[ "amp",    "amplitude", -1,   1, 0.01,   1 ],
	[ "fold",   "folding",    0,   1, 0.01,   0 ],
	[ "hz",     "frequency",  0,   4, 0.01,   1 ],
	[ "delay",  "delay",      0,   4, 0.01,   0 ],
	[ "attack", "attack",     0,   4, 0.01,   0 ],
].map( ( [ name, prop, min, max, step, value ] ) =>
	$.$flex( { x: true, g12: true },
		$.$bold( null, name ),
		$.$input( { "data-what": prop, type: "range", min, max, step, value } ),
		$.$elem( "code" ),		
	)
) );
const opts = {};
let size = 200;
let waveName;
let wave;

function draw() {
	el.$setAttr( opts )
		.$message( GSEV_PERIODICWAVE_DATA, wave )
		.$message( GSEV_PERIODICWAVE_DRAW );
}

el.$observeSize( ( w, h ) => {
	el.$message( GSEV_PERIODICWAVE_RESIZE, `${ w } ${ h }` )
		.$message( GSEV_PERIODICWAVE_DRAW );
	draw();
} );


ctrl.$append( inps );
btns.$onclick( e => {
	const tar = $( e.target );
	const w = tar.$getAttr( "data-w" );

	waveName = w;
	wave = GSUmathWaveFns[ w ]( size );
	btns.$rmAttr( "type" );
	tar.$setAttr( "type", "submit" );
	draw();
} );

$( "[data-w='sine']" ).$click();

inps.$query( "input" )
	.$oninput( e => {
		const tar = $( e.target );
		const val = +tar.$value();
		const what = tar.$getAttr( "data-what" );

		if ( what === "nbPts" ) {
			wave = GSUmathWaveFns[ waveName ]( val );
		} else {
			opts[ what ] = val;
		}
		tar.$next().$text( val );
		draw();
	} )
	.$each( el => el.oninput( { target: el } ) );

</script>
