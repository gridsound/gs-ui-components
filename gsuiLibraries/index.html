<style>
:root {
	--TryMe-w: 340px;
	--TryMe-h: 480px;
}
</style>

<div id="TryComponent">
	<gsui-libraries/>
</div>

<script>
const elLibs = $( "gsui-libraries" );
const elLibDef = elLibs.$message( GSEV_LIBRARIES_GET, "default" );

elLibDef.$message( GSEV_LIBRARY_LOAD, gsuiLibrarySamples );
elLibs.$listen( {
	[ GSEV_LIBRARY_LOADSAMPLE ]: ( _, smp ) => {
		elLibDef.$message( GSEV_LIBRARY_LOADSAMPLE, smp );
		GSUsetTimeout( () => elLibDef.$message( GSEV_LIBRARY_READYSAMPLE, smp ), 1 );
	},
	[ GSEV_LIBRARY_PLAYSAMPLE ]: ( _, smp ) => {
		elLibDef.$message( GSEV_LIBRARY_PLAYSAMPLE, smp, 1 );
	},
} );
</script>
