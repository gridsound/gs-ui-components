<style>
:root {
	--TryMe-w: 220px;
	--TryMe-resize: none;
}
</style>

<div id="TryComponent">
	<gs-flex x g8 wrap>
		<gsui-button text="Cancel"></gsui-button>
		<gsui-button text="Save" model="submit"></gsui-button>
		<gsui-button model="submit" icon="render"></gsui-button>
		<gsui-button text="Danger" model="danger" icon="render"></gsui-button>
		<gsui-button text="Loading..." loading></gsui-button>
		<gsui-button text="plop" disabled></gsui-button>
		<gsui-button text="plop" disabled model="submit"></gsui-button>
		<gsui-button text="plop" disabled model="danger"></gsui-button>
		<gsui-buttons>
			<gsui-button model="submit" icon="square-dash"></gsui-button>
			<gsui-button model="submit" icon="close"></gsui-button>
		</gsui-buttons>
		<gsui-buttons>
			<gsui-button model="button" icon="square-dash"></gsui-button>
			<gsui-button model="button" icon="close"></gsui-button>
		</gsui-buttons>
		<gsui-buttons>
			<gsui-button model="danger" icon="square-dash"></gsui-button>
			<gsui-button model="danger" icon="close"></gsui-button>
		</gsui-buttons>
		<gsui-button model="submit" icon="triangle" light></gsui-button>
	</gs-flex>
</div>

<div id="TryControls"></div>

<script>
$( "#TryComponent gsui-button" ).$onclick( e => lg( e.target ) );
</script>
